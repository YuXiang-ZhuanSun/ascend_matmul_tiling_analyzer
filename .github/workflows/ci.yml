name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Run tests
        run: python -m pytest

      - name: Smoke test CLI
        run: python ./cli.py --input=./cases/quickstart_cases.csv --output-dir=./results/ci_smoke --format=text

      - name: Smoke test panel API
        run: python -c "from matmul_tiling_analyzer.panel import analyze_shape_payload; payload = analyze_shape_payload({'m': 2048, 'k': 4096, 'n': 256, 'dtype': 'bfloat16'}); assert payload['dashboard']['active_cores'] >= 1"
